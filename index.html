<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controlador de Gastos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1>Controlador de Gastos</h1>
      <p class="subtitle">Cadastre e acompanhe seus gastos</p>
    </header>

    <section class="card">
      <h2>Novo gasto</h2>
      <form id="expense-form" novalidate>
        <div class="field">
          <label for="amount">Valor (R$)</label>
          <input
            type="number"
            id="amount"
            name="amount"
            step="0.01"
            min="0.01"
            placeholder="0,00"
            required
          />
          <span class="error" data-error-for="amount"></span>
        </div>

        <div class="field">
          <label for="category">Categoria</label>
          <select id="category" name="category" required>
            <option value="">Selecione...</option>
            <option value="Alimentação">Alimentação</option>
            <option value="Transporte">Transporte</option>
            <option value="Moradia">Moradia</option>
            <option value="Lazer">Lazer</option>
            <option value="Saúde">Saúde</option>
            <option value="Educação">Educação</option>
            <option value="Outros">Outros</option>
          </select>
          <span class="error" data-error-for="category"></span>
        </div>

        <div class="field">
          <label for="description">Descrição</label>
          <input
            type="text"
            id="description"
            name="description"
            maxlength="120"
            placeholder="Ex.: Almoço no restaurante"
            required
          />
          <span class="error" data-error-for="description"></span>
        </div>

        <div class="field">
          <label for="paymentMethod">Método de pagamento</label>
          <select id="paymentMethod" name="paymentMethod" required>
            <option value="">Selecione...</option>
            <option value="Dinheiro">Dinheiro</option>
            <option value="Pix">Pix</option>
            <option value="Cartão de débito">Cartão de débito</option>
            <option value="Cartão de crédito">Cartão de crédito</option>
            <option value="Boleto">Boleto</option>
          </select>
          <span class="error" data-error-for="paymentMethod"></span>
        </div>

        <button type="submit" class="btn-primary">Adicionar gasto</button>
      </form>
    </section>

    <section class="card">
      <div class="list-header">
        <h2>Meus gastos</h2>
        <span class="total">Total: <strong id="total">R$ 0,00</strong></span>
      </div>

      <div id="empty-state" class="empty-state">
        Nenhum gasto cadastrado ainda.
      </div>

      <ul id="expense-list" class="expense-list"></ul>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
